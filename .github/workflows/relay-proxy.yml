name: Relay Proxy
on:
  workflow_dispatch:
  push:

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Create and Run HTTP Proxy
        run: |
          cat > /tmp/proxy.py << 'PYEOF'
import http.server
import urllib.request
import urllib.error
import ssl, sys, os

class ProxyHandler(http.server.BaseHTTPRequestHandler):
    def do_GET(self):
        self.proxy_request("GET")
    def do_POST(self):
        self.proxy_request("POST")
    def do_HEAD(self):
        self.proxy_request("HEAD")
    def proxy_request(self, method):
        if not self.path.startswith("/proxy"):
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"Relay OK. Use /proxy?url=https://...")
            return
        import urllib.parse
        params = urllib.parse.parse_qs(urllib.parse.urlparse(self.path).query)
        target = params.get("url", [None])[0]
        if not target:
            self.send_response(400); self.end_headers(); return
        try:
            ctx = ssl.create_default_context()
            ctx.check_hostname = False
            ctx.verify_mode = ssl.CERT_NONE
            body = None
            if method == "POST":
                cl = int(self.headers.get("Content-Length", 0))
                if 0 < cl < 10*1024*1024:
                    body = self.rfile.read(cl)
            req = urllib.request.Request(target, data=body, headers={
                "User-Agent": self.headers.get("User-Agent", "Mozilla/5.0"),
                "Accept": self.headers.get("Accept", "*/*"),
                "Accept-Language": self.headers.get("Accept-Language", "en-US"),
            }, method=method)
            resp = urllib.request.urlopen(req, timeout=30, context=ctx)
            self.send_response(resp.status)
            skip = {"transfer-encoding", "content-encoding"}
            for k, v in resp.headers.items():
                if k.lower() not in skip:
                    self.send_header(k, v)
            self.send_header("X-Relay", "github-actions")
            self.send_header("Access-Control-Allow-Origin", "*")
            self.end_headers()
            self.wfile.write(resp.read())
        except urllib.error.HTTPError as e:
            self.send_response(e.code); self.end_headers()
            self.wfile.write(e.read())
        except Exception as e:
            self.send_response(502); self.end_headers()
            self.wfile.write(f"Error: {e}".encode())
    def log_message(self, fmt, *args):
        print(f"[{self.log_date_time_string()}] {args[0]}", flush=True)

if __name__ == "__main__":
    port = int(os.environ.get("PORT", 8888))
    http.server.HTTPServer(("0.0.0.0", port), ProxyHandler).serve_forever()
PYEOF
          python3 /tmp/proxy.py &
          sleep 2
          echo "Proxy started on port 8888"
          
          # 通过 localhost.run 暴露公网
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
            -R 80:localhost:8888 localhost.run 2>&1 &
          sleep 10
          echo "=== Tunnel established ==="
          # 保持运行 5.5 小时
          sleep 19800
